name: Image

# Builds the production image on every push to main (as Coolify did), pushes it to GHCR and pins the new
# tag in niklasarnitz/ops (stacks/waslaeuftin/compose.yaml). The push to ops triggers the Komodo deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/niklasarnitz/waslaeuftin

jobs:
  build:
    # delta is arm64; build natively instead of emulating.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # The .ipa/.apk download links are Git LFS objects; cache them to save LFS bandwidth.
      - id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long --include='apps/nextjs/public/**' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}

      - run: git lfs pull --include='apps/nextjs/public/**'

      - id: meta
        run: echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            S3_PUBLIC_BASE_URL=${{ vars.S3_PUBLIC_BASE_URL || 'https://minio.app.arnitz.org/bookworm' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: niklasarnitz/ops
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}

      - name: Pin image tag in ops
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          file=stacks/waslaeuftin/compose.yaml
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$file"
          grep -q "image: ${IMAGE}:${TAG}" "$file"
          if git diff --quiet; then
            echo "Tag already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "waslaeuftin: deploy ${TAG}" -m "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"
          git push
