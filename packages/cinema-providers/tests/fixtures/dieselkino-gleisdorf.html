          "description": "Getreu dem Titel der Tour steht für den unaufhaltsamen Drang der Gruppe, neue Dimensionen zu erreichen und immer größere Bühnen zu erobern. Die acht Mitglieder (Bang Chan, Lee Know, Changbin, Hyunjin, HAN, Felix, Seungmin und I.N) begeistern mit explosiven Choreografien, kraftvollen Vocals und einer mitreißenden Bühnenpräsenz, die das Live-Erlebnis auf ein neues Level hebt.\nDen Auftakt bildet der Song „Hall of Fame“, der den Ehrgeiz von Stray Kids widerspiegelt, ihre eigene Geschichte zu schreiben. Von ihren Anfängen bis zu ihrem heutigen Erfolg zeichnet die Show ihre musikalische Entwicklung eindrucksvoll nach. Dynamische Bühnenbilder, Elemente traditioneller koreanischer Performance-Kunst und spektakuläre Laser-Effekte sorgen für eine einzigartige Atmosphäre und laden das Publikum sowohl im Tokyo Dome als auch im Kino zum Mitsingen, Mittanzen und gemeinsamen Feiern ein.\n\nDirekt aus Tokio übertragen und weltweit in die Kinos gebracht, ermöglicht dieses besondere Live-Viewing-Event Fans auf der ganzen Welt, die Größe, die Energie und das spektakuläre Bühnenerlebnis von Stray Kids gemeinsam auf der großen Leinwand zu erleben.\n",
